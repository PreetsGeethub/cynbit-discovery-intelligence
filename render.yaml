services:
  - type: web
    name: cynbit-discovery-api
    runtime: python
    plan: free
    branch: fix/evidence-and-question-deduplication
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: ANALYZE_RATE_LIMIT_REQUESTS
        value: "5"
      - key: ANALYZE_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
