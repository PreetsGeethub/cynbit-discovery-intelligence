services:
  - type: web
    name: cynbit-discovery-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: ANALYZE_RATE_LIMIT_REQUESTS
        value: "5"
      - key: ANALYZE_RATE_LIMIT_WINDOW_SECONDS
        value: "60"

  - type: web
    name: cynbit-discovery-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_URL
        fromService:
          name: cynbit-discovery-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_REQUEST_TIMEOUT_SECONDS
        value: "180"
